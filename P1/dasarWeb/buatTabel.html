<html>
    <head>
        <title>
            Membuat tabel
        </title>
    </head>
    <body>
        <table border="1" height="100%" width="40%" cellpadding = "20" cellspacing = "5">
            <tr>
                <td rowspan="2" align="right" valign="bottom">
                    <font face=courier>ini baris kolom pertama</font></td>
                <td>ini baris kolom kedua</td>
                <td>ini baris kolom ketiga</td>
            </tr>
            <tr>
                <td>Tambhan satu kolom</td>
                <td colspan="2">ini sekarang menjadi gabungan 2 kolom</td>
            </tr>
        </table>
    </body>
</html>
